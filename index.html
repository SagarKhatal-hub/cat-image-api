<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cat Error Code API Documentation</title>
  <!-- Load Swagger UI CSS from a completely alternative CDN -->
  <link rel="stylesheet" href="https://jsdelivr.net" />
  <style>
    html { box-sizing: border-box; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }
  </style>
</head>
<body>

  <!-- The core container Swagger injects itself into -->
  <div id="swagger-ui"></div>

  <!-- Using static jsDelivr network layer to bypass local file memory cache completely -->
  <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
  
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: 'openapi.yml', 
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis
        ],
        layout: "BaseLayout"
      });
    };
  </script>
</body>
</html>
