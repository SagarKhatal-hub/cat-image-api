<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cat Error Code API Documentation</title>
  <!-- Use a specialized fallback CDN node less likely to be blocked by local firewalls -->
  <link rel="stylesheet" href="https://baomitu.com" />
  <style>
    html { box-sizing: border-box; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }
  </style>
</head>
<body>

  <!-- Core wrapper where Swagger renders its layout elements -->
  <div id="swagger-ui"></div>

  <!-- Load core engine script from alternative sandbox node mirroring standard assets -->
  <script src="https://baomitu.com" crossorigin="anonymous"></script>
  
  <script>
    window.onload = () => {
      // Direct render blueprint mapping
      window.ui = SwaggerUIBundle({
        url: 'openapi.yml', 
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis
        ],
        layout: "BaseLayout"
      });
    };
  </script>
</body>
</html>
